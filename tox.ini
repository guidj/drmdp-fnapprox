[tox]
minversion = 4.22
skip_missing_interpreters = true
isolated_build = true
envlist = test,manifest,check-formatting,check-lint,check-lint-types
requires =
  uv >= 0.8.0
  tox-uv >= 1.30.0

[testenv]
# All environments install from uv.lock via `uv sync --locked` (tox-uv).
# Tool environments use `only_groups` so they install just their tool
# group from the lock instead of the full project stack.
runner = uv-venv-lock-runner
basepython = python3.13
setenv =
    SOURCE={toxinidir}/src
    TEST_SOURCE={toxinidir}/tests
    MYPYPATH = "$PYTHONPATH:{toxinidir}/src:{toxinidir}/tests"
    PIP_INDEX_URL = https://pypi.org/simple
    UV_DEFAULT_INDEX = https://pypi.org/simple

[testenv:test]
# project (editable) + dev group, both locked
dependency_groups = dev
commands =
    coverage erase
    pytest {posargs}

[testenv:docs]
only_groups = docs
commands =
    mkdocs build

[testenv:manifest]
only_groups = manifest
commands =
    check-manifest

[testenv:check-formatting]
only_groups = lint
commands =
    ruff format {toxinidir}/src {toxinidir}/tests --line-length 88 --diff --check
    ruff format {toxinidir}/notebooks --line-length 88 --diff --check

[testenv:format]
only_groups = lint
commands =
    ruff format {toxinidir}/src {toxinidir}/tests --line-length 88
    ruff format {toxinidir}/notebooks  --line-length 88

[testenv:lint]
only_groups = lint
commands =
    ruff check --fix --extend-select I {toxinidir}/src {toxinidir}/tests
    ruff check --fix --extend-select I {toxinidir}/notebooks

[testenv:check-lint]
only_groups = lint
commands =
    ruff check --extend-select I {toxinidir}/src {toxinidir}/tests
    ruff check --extend-select I {toxinidir}/notebooks

[testenv:check-lint-types]
only_groups = types
commands =
    mypy {toxinidir}/src --install-types
    mypy {toxinidir}/tests --install-types


[testenv:lint-format]
only_groups = lint
commands =
    ruff check --extend-select I --fix {toxinidir}/src {toxinidir}/tests
    ruff format src tests

[testenv:check-lint-format]
only_groups = lint
commands =
    ruff check --extend-select I {toxinidir}/src {toxinidir}/tests
    ruff check --extend-select I {toxinidir}/notebooks

[testenv:check-types]
only_groups = types
commands =
    # config is in pyproject.toml
    mypy
